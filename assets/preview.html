<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>html,body{margin:0;background:#ede9de}svg{display:block;width:100%;height:auto}</style></head><body>__POSTER_SVG__
<script>
function send(data){if(window.PosterBridge)PosterBridge.postMessage(JSON.stringify(data));}
async function exportPng(){
 try{
  const svg=document.querySelector('svg');
  const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  try{
   const img=new Image();img.src=url;await img.decode();
   const canvas=document.createElement('canvas');canvas.width=1621;canvas.height=1987;
   canvas.getContext('2d').drawImage(img,0,0,1621,1987);
   const data=canvas.toDataURL('image/png').split(',')[1];
   for(let i=0;i<data.length;i+=131072)send({type:'chunk',data:data.slice(i,i+131072)});
   send({type:'done'});
  }finally{URL.revokeObjectURL(url)}
 }catch(e){send({type:'error',message:String(e)})}
}
window.addEventListener('load',()=>send({type:'ready'}));
</script></body></html>
